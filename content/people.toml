# Profile library: the people who appear as authors on blog posts.
#
# A post lists its authors by name in the frontmatter (`authors: [Zhenting Qi, Baiyu Zhu]`);
# the affiliation, photo and link come from here, so they are written once.
#
#   name         as it should be printed; posts refer to a person by exactly this name
#   affiliation  shown under the author line
#   avatar       a square photo in public/people/, 256px or larger; without one the page
#                shows the person's initials
#   url          where a click on the author goes: their homepage (or "/" for this site)

[[people]]
name = "Zhenting Qi"
affiliation = "Harvard University"
avatar = "/people/zhenting-qi.jpg"
url = "/"

